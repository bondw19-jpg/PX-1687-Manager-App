<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Red background circle -->
  <circle cx="100" cy="100" r="100" fill="#C8102E"/>

  <!-- ── PANDA FACE ── -->

  <!-- Black ears (behind head) -->
  <ellipse cx="62" cy="52" rx="18" ry="16" fill="#1a1a1a"/>
  <ellipse cx="138" cy="52" rx="18" ry="16" fill="#1a1a1a"/>

  <!-- White ear inner -->
  <ellipse cx="62" cy="53" rx="10" ry="9" fill="#e8e8e8"/>
  <ellipse cx="138" cy="53" rx="10" ry="9" fill="#e8e8e8"/>

  <!-- White face / head -->
  <ellipse cx="100" cy="95" rx="46" ry="44" fill="#FFFFFF"/>

  <!-- Black eye patches (large teardrop / oval shaped - classic PE style) -->
  <!-- Left eye patch -->
  <ellipse cx="82" cy="88" rx="16" ry="14" fill="#1a1a1a" transform="rotate(-15 82 88)"/>
  <!-- Right eye patch -->
  <ellipse cx="118" cy="88" rx="16" ry="14" fill="#1a1a1a" transform="rotate(15 118 88)"/>

  <!-- Eyes (white highlights inside patches) -->
  <ellipse cx="82" cy="88" rx="7" ry="7" fill="#FFFFFF"/>
  <ellipse cx="118" cy="88" rx="7" ry="7" fill="#FFFFFF"/>

  <!-- Pupils -->
  <circle cx="83" cy="89" r="4.5" fill="#1a1a1a"/>
  <circle cx="119" cy="89" r="4.5" fill="#1a1a1a"/>

  <!-- Eye shine dots -->
  <circle cx="84.5" cy="87" r="1.5" fill="#FFFFFF"/>
  <circle cx="120.5" cy="87" r="1.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <ellipse cx="100" cy="103" rx="5" ry="3.5" fill="#1a1a1a"/>

  <!-- Mouth - subtle curved smile -->
  <path d="M91 110 Q100 117 109 110" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush (subtle) -->
  <ellipse cx="75" cy="108" rx="9" ry="5" fill="#e8b4b4" opacity="0.5"/>
  <ellipse cx="125" cy="108" rx="9" ry="5" fill="#e8b4b4" opacity="0.5"/>

  <!-- ── TEXT: PANDA EXPRESS ── -->
  <!-- White text at bottom inside the circle -->
  <text
    x="100"
    y="157"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="16"
    letter-spacing="1.5"
    fill="#FFFFFF"
  >PANDA EXPRESS</text>

  <!-- Thin white divider line above text -->
  <line x1="38" y1="143" x2="162" y2="143" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
</svg>
