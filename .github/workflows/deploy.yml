name: Deploy Panda Manager Hub

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Deploy to Firebase App Hosting
        run: npx firebase-tools deploy --project px-1687-manager-app --token ${{ secrets.FIREBASE_TOKEN }}
